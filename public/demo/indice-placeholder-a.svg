<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="titulo-indice-a">
  <title id="titulo-indice-a">Vista previa en lector de escritorio — pendiente sustituir por fotografía de Kindle real</title>
  <rect width="640" height="640" fill="#F6F4EC" />

  <text x="320" y="70" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" letter-spacing="2" fill="#6B6650">ÍNDICE</text>
  <line x1="60" y1="90" x2="580" y2="90" stroke="#C9C1A4" stroke-width="1" />

  <g font-family="Georgia, serif" fill="#17140D" font-size="17">
    <text x="60" y="150">Cómo aprender de verdad una habilidad nueva</text>
    <text x="580" y="150" text-anchor="end" fill="#6B6650">4</text>
    <text x="60" y="204" fill="#47432F">Notas sobre escribir con calma</text>
    <text x="580" y="204" text-anchor="end" fill="#6B6650">11</text>
    <text x="60" y="258">Por qué guardamos artículos que nunca leemos</text>
    <text x="580" y="258" text-anchor="end" fill="#6B6650">19</text>
    <text x="60" y="312" fill="#47432F">El caso de la lectura larga en e-ink</text>
    <text x="580" y="312" text-anchor="end" fill="#6B6650">27</text>
    <text x="60" y="366">Un repaso a la semana en enlaces</text>
    <text x="580" y="366" text-anchor="end" fill="#6B6650">33</text>
  </g>

  <g stroke="#C9C1A4" stroke-width="1" stroke-dasharray="1 5">
    <line x1="380" y1="140" x2="565" y2="140" />
    <line x1="290" y1="194" x2="565" y2="194" />
    <line x1="430" y1="248" x2="565" y2="248" />
    <line x1="350" y1="302" x2="565" y2="302" />
    <line x1="320" y1="356" x2="565" y2="356" />
  </g>

  <line x1="60" y1="560" x2="580" y2="560" stroke="#C9C1A4" stroke-width="1" />
  <text x="320" y="590" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#6B6650">Vista previa en lector de escritorio — pendiente sustituir por fotografía de Kindle real</text>
</svg>
