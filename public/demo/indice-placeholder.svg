<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="titulo-indice">
  <title id="titulo-indice">Vista previa en lector de escritorio — pendiente sustituir por fotografía de Kindle real</title>
  <rect width="640" height="420" rx="14" fill="#FFFFFF" stroke="#DCD3BC" stroke-width="2" />
  <rect x="0" y="0" width="640" height="46" rx="14" fill="#EFE9DC" />
  <circle cx="28" cy="23" r="6" fill="#DCD3BC" />
  <circle cx="48" cy="23" r="6" fill="#DCD3BC" />
  <circle cx="68" cy="23" r="6" fill="#DCD3BC" />
  <text x="320" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#55503F">Índice — semana del 8 al 14 de septiembre</text>

  <g font-family="Georgia, serif" fill="#1C1810">
    <text x="40" y="100" font-size="17">1. Cómo aprender de verdad una habilidad nueva</text>
    <text x="560" y="100" font-size="15" text-anchor="end" fill="#756E58">4</text>
    <text x="40" y="142" font-size="17">2. Notas sobre escribir con calma</text>
    <text x="560" y="142" font-size="15" text-anchor="end" fill="#756E58">11</text>
