    <text x="560" y="184" font-size="15" text-anchor="end" fill="#756E58">19</text>
    <text x="40" y="226" font-size="17">4. El caso de la lectura larga en e-ink</text>
    <text x="560" y="226" font-size="15" text-anchor="end" fill="#756E58">27</text>
