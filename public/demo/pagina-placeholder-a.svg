<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="titulo-pagina-a">
  <title id="titulo-pagina-a">Página de artículo dentro del EPUB, con tipografía y maquetación pensadas para e-ink</title>
  <rect width="640" height="640" fill="#F6F4EC" />

  <text x="320" y="70" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" letter-spacing="2" fill="#6B6650">READLATER EPUB</text>
  <line x1="60" y1="90" x2="580" y2="90" stroke="#C9C1A4" stroke-width="1" />

  <text x="60" y="172" font-family="Georgia, serif" font-size="66" fill="#A3301F">E</text>
  <g font-family="Georgia, serif" font-size="14.5" fill="#17140D" fill-opacity="0.9">
    <text x="118" y="130">l resultado no son artículos sueltos: es</text>
    <text x="118" y="152">un único EPUB con índice, navegable</text>
    <text x="118" y="174">como un libro.</text>
  </g>

  <g font-family="Georgia, serif" font-size="14.5" fill="#17140D" fill-opacity="0.86">
    <text x="60" y="216">Todo ocurre en tu Mac. Sin cuenta, sin</text>
    <text x="60" y="240">servidor propio, sin sincronización en la</text>
    <text x="60" y="264">nube — lo único que sale del dispositivo</text>
    <text x="60" y="288">es el artículo que ya pediste leer.</text>
  </g>

  <g font-family="Georgia, serif" font-size="14.5" fill="#17140D" fill-opacity="0.72">
    <text x="60" y="330">La semana acumulada en Recordatorios</text>
    <text x="60" y="354">se convierte en un solo documento</text>
    <text x="60" y="378">navegable, sin depender de acordarte</text>
    <text x="60" y="402">al momento de leer el enlace.</text>
  </g>

  <text x="320" y="430" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#6B6650">— 4 —</text>

  <line x1="60" y1="560" x2="580" y2="560" stroke="#C9C1A4" stroke-width="1" />
  <text x="320" y="590" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#6B6650">Vista previa en lector de escritorio — pendiente sustituir por fotografía de Kindle real</text>
</svg>
